name: Deploy portfolio to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Validate and prepare static site
        run: |
          node --check app.js
          node --check site-config.js
          python3 scripts/check_site.py
          mkdir -p _site
          cp index.html styles.css app.js site-config.js _site/
          mkdir -p _site/assets/images
          cp assets/favicon.svg assets/Jay_Mehta_Resume.pdf _site/assets/
          cp assets/images/*.webp _site/assets/images/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
